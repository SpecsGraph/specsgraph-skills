name: validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate the plugin and marketplace manifests
        run: |
          npx -y @anthropic-ai/claude-code plugin validate --strict .
          npx -y @anthropic-ai/claude-code plugin validate --strict .claude-plugin/plugin.json
      - name: Check the checker
        run: node scripts/check-skills.mjs --self-test
      - name: Check tool names and arguments against scripts/tools.json
        run: node scripts/check-skills.mjs
