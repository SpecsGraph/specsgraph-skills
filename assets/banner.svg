<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-label="SpecsGraph Skills: Agent Skills for domain modelling over the SpecsGraph MCP server">
  <defs>
    <style>
      .sans { font-family: Inter, -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .serif { font-family: Georgia, "Times New Roman", "Iowan Old Style", serif; }
      .mono { font-family: "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    </style>
  </defs>
  <rect width="1200" height="420" fill="#F4F4F4"/>
  <!-- mark + wordmark -->
  <g transform="translate(64 52) scale(2.2)">
    <path d="M5 16.5 11 5.5l6 11" stroke="#1C1C1C" stroke-width="1.5" fill="none"/>
    <path d="M5 16.5h12" stroke="#1C1C1C" stroke-width="1.5"/>
    <circle cx="11" cy="5.5" r="3" fill="#4A38F5"/>
    <circle cx="5" cy="16.5" r="3" fill="#1C1C1C"/>
    <circle cx="17" cy="16.5" r="3" fill="#1C1C1C"/>
  </g>
  <text x="124" y="88" class="sans" font-size="30" font-weight="700" fill="#1C1C1C">SpecsGraph <tspan fill="#4A38F5">Skills</tspan></text>
  <!-- chip -->
  <rect x="64" y="128" width="286" height="34" rx="4" fill="none" stroke="#DBDBDB"/>
  <text x="80" y="151" class="mono" font-size="14" letter-spacing="1.5" fill="#777777">OPEN-SOURCE AGENT SKILLS</text>
  <!-- headline -->
  <text x="64" y="228" class="serif" font-size="58" fill="#1C1C1C">Your model, agreed.</text>
  <text x="64" y="292" class="sans" font-size="58" font-weight="700" fill="#1C1C1C">Your agents, guided.</text>
  <text x="64" y="340" class="sans" font-size="21" fill="#777777">Four skills that drive the SpecsGraph MCP server: agents propose,</text>
  <text x="64" y="370" class="sans" font-size="21" fill="#777777">people accept, and every change lands on Main through a Task.</text>
  <!-- skill cards -->
  <g transform="translate(760 72)">
    <g>
      <rect width="180" height="120" rx="10" fill="#FFFFFF" stroke="#DBDBDB"/>
      <g transform="translate(18 18) scale(1.5)">
        <circle cx="12" cy="12" r="9" stroke="#1C1C1C" stroke-width="1.5" fill="none"/>
        <path d="M15.5 8.5 13.6 13.6 8.5 15.5l1.9-5.1z" fill="#4A38F5"/>
      </g>
      <text x="18" y="86" class="sans" font-size="16" font-weight="700" fill="#1C1C1C">director</text>
      <text x="18" y="106" class="sans" font-size="13" fill="#777777">reads state, routes</text>
    </g>
    <g transform="translate(196 0)">
      <rect width="180" height="120" rx="10" fill="#FFFFFF" stroke="#DBDBDB"/>
      <g transform="translate(18 18) scale(1.5)">
        <path d="M12 3l7.8 4.5v9L12 21l-7.8-4.5v-9z" stroke="#1C1C1C" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
        <path d="M12 3v9m0 0-7.8 4.5M12 12l7.8 4.5" stroke="#1C1C1C" stroke-width="1.5"/>
        <circle cx="12" cy="12" r="2.2" fill="#4A38F5"/>
      </g>
      <text x="18" y="86" class="sans" font-size="16" font-weight="700" fill="#1C1C1C">engineer</text>
      <text x="18" y="106" class="sans" font-size="13" fill="#777777">contexts, model, behaviour</text>
    </g>
    <g transform="translate(0 136)">
      <rect width="180" height="120" rx="10" fill="#FFFFFF" stroke="#DBDBDB"/>
      <g transform="translate(18 18) scale(1.5)">
        <rect x="4" y="3.5" width="16" height="17" rx="2.5" stroke="#1C1C1C" stroke-width="1.5" fill="none"/>
        <path d="M8 8.5h8M8 12h8M8 15.5h5" stroke="#1C1C1C" stroke-width="1.5" stroke-linecap="round"/>
        <circle cx="17" cy="16" r="3" fill="#4A38F5"/>
      </g>
      <text x="18" y="86" class="sans" font-size="16" font-weight="700" fill="#1C1C1C">product</text>
      <text x="18" y="106" class="sans" font-size="13" fill="#777777">features and scenarios</text>
    </g>
    <g transform="translate(196 136)">
      <rect width="180" height="120" rx="10" fill="#FFFFFF" stroke="#DBDBDB"/>
      <g transform="translate(18 18) scale(1.5)">
        <path d="M4 7.5 12 4l8 3.5-8 3.5z" stroke="#1C1C1C" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
        <path d="M4 12l8 3.5 8-3.5" stroke="#1C1C1C" stroke-width="1.5" stroke-linejoin="round" fill="none"/>
        <circle cx="17.5" cy="17.5" r="3" fill="#4A38F5"/>
      </g>
      <text x="18" y="86" class="sans" font-size="16" font-weight="700" fill="#1C1C1C">brownfield</text>
      <text x="18" y="106" class="sans" font-size="13" fill="#777777">map an existing codebase</text>
    </g>
  </g>
  <text x="64" y="404" class="mono" font-size="13" letter-spacing="2" fill="#959595">SPECSGRAPH.IO</text>
</svg>
